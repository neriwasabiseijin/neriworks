<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neriworks</title>
<meta name="description" content="ねりわさびの作品集。ブラウザですぐ遊べる小さな作品を、少しずつ増やしています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&display=swap">
<script src="common/sound.js"></script><!-- 音量は全作品と共通の設定に従う -->
<style>
  /* 作品集は常にダーク（端末のライト/ダーク設定には従わない） */
  :root {
    --bg: #1c1917; --text: #f5efe9; --sub: #b4a89d; --accent: #ff906f; --new: #49c985;
    --shell: #8e8896; --shell-hi: #a7a1ae; --shell-lo: #6d6875; --label: #2f2a2c;
    --console: #4b4553; --console-hi: #6a6375; --console-lo: #322d38; --wasabi: #6fa83a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 48px; }
  .logo { margin: 0; font: 400 clamp(40px, 11vw, 64px)/1 "Righteous", system-ui, sans-serif; letter-spacing: .02em; }
  .logo .w { color: var(--wasabi); }
  .logo .dot { display: inline-block; width: .16em; height: .16em; margin-left: .06em; border-radius: 50%; background: var(--wasabi); }
  .tagline { margin: 8px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .35em; color: var(--wasabi); }
  .lead { color: var(--sub); margin: 0 0 28px; }
  .grid { display: grid; gap: 28px 20px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

  /* カセット */
  a.cart { display: block; text-decoration: none; color: inherit; outline: none; }
  .shell {
    position: relative; padding: 26px 14px 18px;
    background: linear-gradient(180deg, var(--shell-hi), var(--shell) 30%, var(--shell-lo));
    border-radius: 10px 10px 18px 18px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.18);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .shell::before { /* 上部のすべり止め */
    content: ""; position: absolute; left: 22%; right: 22%; top: 8px; height: 10px;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 3px, transparent 3px 7px);
    border-radius: 2px;
  }
  .shell::after { /* 下部の端子側の段差 */
    content: ""; position: absolute; left: 10%; right: 10%; bottom: 5px; height: 6px;
    background: rgba(0,0,0,.18); border-radius: 3px;
  }
  a.cart:hover .shell, a.cart:focus-visible .shell { transform: translateY(-4px) rotate(-1deg); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18), 0 12px 22px rgba(0,0,0,.22); }
  a.cart:focus-visible .shell { outline: 3px solid var(--accent); outline-offset: 3px; }
  .label { background: var(--label); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 2px rgba(0,0,0,.12); }
  .thumb { aspect-ratio: 4 / 3; background: #222 center / cover no-repeat; display: grid; place-items: center; font-size: 56px; }
  .label-title { padding: 8px 10px; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--new); border-radius: 999px; padding: 2px 8px; }
  .caption { padding: 10px 4px 0; }
  .desc { color: var(--sub); font-size: 14px; line-height: 1.5; margin: 0 0 6px; }
  .meta { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; }
  .play { color: var(--accent); font-weight: 700; }
  footer { margin-top: 36px; color: var(--sub); font-size: 12px; text-align: center; }
  footer a { color: inherit; }

  /* 起動演出 */
  .boot { position: fixed; inset: 0; z-index: 10; }
  .boot-bg { position: absolute; inset: 0; background: rgba(12,10,16,.82); opacity: 0; }
  .boot-cart { position: fixed; margin: 0; z-index: 1; transform-origin: 50% 50%; }
  .boot-cart:hover { transform: none; }
  /* 本体：上面（カセットより奥）と手前の面（カセットより手前）を別々に置いて、挿さって見えるようにする */
  .con-top, .con-front { position: fixed; left: 50%; width: min(420px, 92vw); transform: translate(-50%, 150px); }
  .con-top { bottom: 110px; height: 40px; z-index: 0; background: var(--console-hi); border-radius: 18px 18px 0 0; }
  .slot { position: absolute; left: 50%; top: 14px; height: 14px; transform: translateX(-50%); background: #0d0b10; border-radius: 4px; box-shadow: inset 0 3px 4px rgba(0,0,0,.8); }
  .con-front {
    bottom: 0; height: 120px; z-index: 2;
    background: linear-gradient(180deg, var(--console), var(--console-lo)); border-radius: 6px 6px 0 0;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.12);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    color: rgba(255,255,255,.55); font: 700 12px/1 system-ui, sans-serif; letter-spacing: .2em;
  }
  .led { width: 10px; height: 10px; border-radius: 50%; background: #3a1414; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); transition: background .1s, box-shadow .1s; }
  .led.on { background: #ff3b3b; box-shadow: 0 0 10px 3px rgba(255,59,59,.7); }
  .flash, .fade { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .flash { z-index: 4; background: #fff; }
  .fade { z-index: 5; background: #000; }
</style>
</head>
<body>
<main>
  <h1 class="logo">Neri<span class="w">works</span><span class="dot"></span></h1>
  <p class="tagline">ねりわさびの作品集</p>
  <p class="lead">ブラウザですぐ遊べる小さな作品を、少しずつ増やしています。</p>
  <div class="grid" id="grid"></div>
  <footer>スマホでもPCでも遊べます ・ <a href="credits.html">クレジット・ライセンス</a></footer>
</main>
<script>
  // 新しいゲームはこの配列の先頭に1行足すだけ。folder はこの index.html から見たフォルダ名。
  const GAMES = [
    { folder: "hanabi", title: "夜空満開はなびチェイン", date: "2026-10-13", thumb: "thumbs/hanabi.webp", emoji: "🎆", desc: "花火玉を引っ張って撃ち上げ、夜空の火の玉をつぎつぎ連鎖させる花火パズル。星や大玉を最後に咲かせて、ひと晩の花火大会を大団円へ。" },
    { folder: "monster-merge", title: "まるもんえぼりゅーしょん", date: "2026-10-12", thumb: "thumbs/monster-merge.webp", emoji: "🐉", desc: "同じモンスターがくっつくと進化する落ちものパズル。のろいの岩を砕きながら、キングドラゴンを目指そう。" },
  ];

  const NEW_DAYS = 3;
  const grid = document.getElementById("grid");
  const today = new Date();
  for (const g of GAMES) {
    const a = document.createElement("a");
    a.className = "cart";
    a.href = `${g.folder}/index.html`;
    a.innerHTML = `
      <div class="shell"><div class="label"><div class="thumb"></div><div class="label-title"></div></div></div>
      <div class="caption"><p class="desc"></p><div class="meta"><span></span><span class="play">あそぶ ▶</span></div></div>`;
    const thumb = a.querySelector(".thumb");
    if (g.thumb) {
      const img = new Image();
      img.onload = () => { thumb.style.backgroundImage = `url("${g.thumb}")`; };
      img.onerror = () => { thumb.textContent = g.emoji; };
      img.src = g.thumb;
    } else thumb.textContent = g.emoji;
    const t = a.querySelector(".label-title");
    t.textContent = g.title;
    if ((today - new Date(g.date)) / 864e5 < NEW_DAYS) {
      const b = document.createElement("span"); b.className = "badge"; b.textContent = "NEW"; t.append(b);
    }
    a.querySelector(".desc").textContent = g.desc;
    a.querySelector(".meta span").textContent = g.date;
    a.addEventListener("click", e => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // 新しいタブで開く操作はそのまま
      e.preventDefault();
      boot(a);
    });
    grid.append(a);
  }

  // カシャッという音（効果音ファイルなしで合成）
  function clack(ctx, t, freq, len, vol) {
    const n = Math.floor(ctx.sampleRate * len);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1.2;
    const g = ctx.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(MG.sound.ui); src.start(t);
  }
  // 起動音（ピロン）
  function bootSound(ctx, t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.setValueAtTime(988, t); o.frequency.setValueAtTime(1976, t + 0.08);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.01);
    g.gain.setValueAtTime(0.08, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g).connect(MG.sound.ui); o.start(t); o.stop(t + 0.65);
  }

  const wait = ms => new Promise(res => setTimeout(res, ms));
  let booting = false;
  async function boot(a) {
    if (booting) return;
    booting = true;
    const href = a.href;
    let ctx = null;
    try { ctx = MG.sound.ctx; if (ctx && ctx.state !== "running") ctx.resume(); } catch {}

    const shell = a.querySelector(".shell");
    const r = shell.getBoundingClientRect();
    const layer = document.createElement("div");
    layer.className = "boot";
    layer.innerHTML = `<div class="boot-bg"></div>
      <div class="con-top"><div class="slot"></div></div>
      <div class="con-front"><span class="led"></span>POWER</div>
      <div class="flash"></div><div class="fade"></div>`;
    const cart = shell.cloneNode(true);
    cart.className = "shell boot-cart";
    Object.assign(cart.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", transition: "none" });
    layer.append(cart);
    document.body.append(layer);
    shell.style.visibility = "hidden";

    const q = s => layer.querySelector(s);
    const fill = (duration, easing, delay = 0) => ({ duration, easing, delay, fill: "forwards" });

    const W = innerWidth, H = innerHeight;
    const conW = Math.min(420, W * 0.92), conTop = H - 150;
    const scale = Math.min((conW * 0.62) / r.width, (H * 0.45) / r.height);
    const h = r.height * scale;
    q(".slot").style.width = r.width * scale + 12 + "px";
    const dx = W / 2 - (r.left + r.width / 2);
    const cy = r.top + r.height / 2;
    const slotY = conTop + 30;                   // 本体の手前の面の上端
    const aboveY = slotY - h / 2 - 40 - h * 0.1; // 挿し口の上で止まる位置（中心）
    const inY = slotY - h / 2 + h * 0.55;        // 半分ほど挿さった位置（中心）
    const at = (y, rot = 0, s = scale) => `translate(${dx}px, ${y - cy}px) scale(${s}) rotate(${rot}deg)`;

    // 1. 暗転しつつ本体がせり上がり、カセットが挿し口の上へ
    q(".boot-bg").animate([{ opacity: 0 }, { opacity: 1 }], fill(300, "ease-out"));
    const con = [q(".con-top"), q(".con-front")];
    con.forEach(el => el.animate([{ transform: "translate(-50%, 150px)" }, { transform: "translate(-50%, 0)" }], fill(380, "cubic-bezier(.2,.9,.3,1.1)")));
    await cart.animate([
      { transform: "translate(0,0) scale(1) rotate(0deg)" },
      { transform: at(aboveY, -4), offset: 0.75 },
      { transform: at(aboveY, 0) },
    ], fill(560, "cubic-bezier(.3,.7,.3,1)")).finished;

    // 2. 少しためてから、ストンと挿さる（カシャッ）
    await cart.animate([
      { transform: at(aboveY) },
      { transform: at(aboveY - 10), offset: 0.35 },
      { transform: at(inY) },
    ], fill(300, "cubic-bezier(.6,0,.9,.6)", 80)).finished;
    if (ctx) { const t = ctx.currentTime; clack(ctx, t, 2600, 0.05, 0.9); clack(ctx, t + 0.045, 900, 0.09, 0.8); }
    con.forEach(el => el.animate([{ transform: "translate(-50%, 0)" }, { transform: "translate(-50%, 5px)" }, { transform: "translate(-50%, 0)" }], { duration: 140, easing: "ease-out" }));
    cart.animate([{ transform: at(inY) }, { transform: at(inY + 6) }], fill(70, "ease-out"));

    // 3. 電源ON → 光って暗転 → ゲームへ
    await wait(260);
    q(".led").classList.add("on");
    if (ctx) bootSound(ctx, ctx.currentTime);
    q(".flash").animate([{ opacity: 0 }, { opacity: 0.9, offset: 0.25 }, { opacity: 0 }], fill(420, "ease-out", 120));
    await q(".fade").animate([{ opacity: 0 }, { opacity: 1 }], fill(380, "ease-in", 420)).finished;
    go(href);
  }

  // ゲーム側（common/system.js）と受け渡す合図
  const POWER_KEY = "minigames:power";
  function go(href) {
    try { sessionStorage.setItem(POWER_KEY, "on"); } catch {}
    location.href = href;
  }
  // ゲームの電源を切って戻ってきたときは、黒からゆっくり明ける
  try {
    if (sessionStorage.getItem(POWER_KEY) === "off") {
      sessionStorage.removeItem(POWER_KEY);
      const cover = document.createElement("div");
      cover.style.cssText = "position:fixed;inset:0;background:#000;z-index:20;pointer-events:none";
      document.body.append(cover);
      cover.animate([{ opacity: 1 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], { duration: 700, easing: "ease-out", fill: "forwards" })
        .finished.then(() => cover.remove());
    }
  } catch {}

  // ブラウザの「戻る」で戻ってきたとき、演出を片付ける
  addEventListener("pageshow", e => {
    if (!e.persisted) return;
    document.querySelectorAll(".boot").forEach(el => el.remove());
    document.querySelectorAll(".shell").forEach(el => el.style.visibility = "");
    booting = false;
  });
</script>
</body>
</html>
