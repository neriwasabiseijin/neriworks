<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>夜空満開はなびチェイン</title>
<link rel="stylesheet" href="../common/system.css">
<script src="../common/system.js" data-frame="#stage" data-loading></script>
<script src="../common/splash.js"></script>
<script src="../common/sound.js" data-bgm="5" data-sfx="5" data-button></script>
<script src="../common/share.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<template id="splash">
  <section data-sec="2.6">
    <svg class="splash-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 19h7l10-8v26l-10-8H8z" fill="currentColor"/><path d="M31 18a8 8 0 0 1 0 12"/><path d="M36 13a15 15 0 0 1 0 22"/></svg>
    <p>音を出して遊ぶのがおすすめです<small>花火は音楽に合わせて開きます</small></p>
  </section>
</template>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="title" class="overlay">
      <p class="eyebrow">ver1.1.0</p>
      <h1><img class="logo" src="assets/logo.webp" width="640" height="678" alt="夜空満開はなびチェイン"></h1>
      <p class="lead"><span>しまった、</span><span>火をつけずに</span><span>打ち上げちゃった！</span><br><span>1発の花火で、</span><span>夜空の玉を</span><span>つぎつぎ咲かせよう。</span></p>
      <p id="titleBest" class="best"></p>
      <button id="startBtn" type="button" class="primary">あそぶ</button>
      <button id="howBtn" type="button" class="secondary">あそびかた</button>
      <button id="seedBtn" type="button" class="link" hidden>シードで遊ぶ</button>
    </div>
    <div id="seedBox" class="overlay" hidden>
      <p class="eyebrow">シードで遊ぶ</p>
      <p class="lead">シードと景を入れると、同じ夜空を何度でも遊べます。<br>遊び終わるたびに、やり直しとお手本を選べます。</p>
      <label class="field">シード<input id="seedIn" type="text" inputmode="numeric" maxlength="6" autocomplete="off"></label>
      <label class="field">景<select id="stageIn"></select></label>
      <p id="seedErr" class="note"></p>
      <div class="res-btns">
        <button id="seedGo" type="button" class="primary">はじめる</button>
        <button id="seedBack" type="button" class="secondary">もどる</button>
      </div>
    </div>
    <div id="practice" class="overlay" hidden>
      <p class="eyebrow" id="prHead"></p>
      <p class="pr-res" id="prRes"></p>
      <button id="prAgain" type="button" class="primary">もう一度</button>
      <button id="prAnswer" type="button" class="secondary">お手本を見る</button>
      <button id="prNext" type="button" class="secondary">次の景へ</button>
      <button id="prTitle" type="button" class="link">タイトルへ</button>
    </div>
    <div id="tut" hidden>
      <div class="tut-card">
        <div class="tut-dots" id="tutDots"></div>
        <h2 id="tutCap"></h2>
        <p id="tutSub"></p>
      </div>
      <div class="tut-btns">
        <button id="tutSkip" type="button" class="tut-skip">スキップ</button>
        <button id="tutNext" type="button" class="tut-next">つぎへ</button>
      </div>
    </div>
    <button id="clearAnswer" type="button" class="clear-answer" hidden>お手本を見る</button>
    <div id="result" class="overlay" hidden>
      <p class="eyebrow" id="resHead">おしまい</p>
      <div class="big" id="resScore">0</div>
      <p id="resPen" class="res-pen" hidden></p>
      <p id="resBest" class="best"></p>
      <figure class="chair">
        <blockquote id="resComment"></blockquote>
        <figcaption>花火大会 実行委員長</figcaption>
      </figure>
      <p class="res-meta"><span id="resStage"></span><span id="resChain"></span><span id="resSeed"></span></p>
      <div class="res-btns">
        <button id="mercyBtn" type="button" class="primary" hidden>泣きの1回！</button>
        <button id="retryBtn" type="button" class="primary">タイトルへ</button>
      </div>
      <div class="res-btns sub">
        <button id="answerBtn" type="button" class="secondary" hidden>お手本を見る</button>
        <button id="shareBtn" type="button" class="secondary">シェアする</button>
      </div>
    </div>
  </div>
</div>
<script src="js/core/config.js"></script>
<script src="js/core/random.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/canvas.js"></script>
<script src="js/media/music.js"></script>
<script src="js/media/sfx.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/stage.js"></script>
<script src="js/game/shell.js"></script>
<script src="js/game/rhythm.js"></script>
<script src="js/game/burst.js"></script>
<script src="js/game/cloud.js"></script>
<script src="js/game/finale.js"></script>
<script src="js/game/program.js"></script>
<script src="js/game/ending.js"></script>
<script src="js/game/update.js"></script>
<script src="js/view/particles.js"></script>
<script src="js/view/sky.js"></script>
<script src="js/view/crowd.js"></script>
<script src="js/view/board.js"></script>
<script src="js/view/render.js"></script>
<script src="js/view/screens.js"></script>
<script src="js/view/share.js"></script>
<script src="js/view/tutorial.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
